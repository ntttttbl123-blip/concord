version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "build(deps)"
    groups:
      vite-vitest:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "@vitest/*"
      runtime-dependencies:
        dependency-type: production
        exclude-patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "@vitest/*"
      development-dependencies:
        dependency-type: development
        exclude-patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "@vitest/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "build(deps)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: "build(deps)"
