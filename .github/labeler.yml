'area:core':
  - changed-files:
      - any-glob-to-any-file: 'packages/core/**'

'area:api':
  - changed-files:
      - any-glob-to-any-file: 'services/api/**'

'area:web':
  - changed-files:
      - any-glob-to-any-file: 'apps/web/**'

'area:docs':
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'

'area:ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'Dockerfile'
          - '.dockerignore'
