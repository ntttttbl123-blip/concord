# Concord behind nginx: one reverse proxy facing the internet.
#
# Set CONCORD_TRUST_PROXY=1
#
# X-Forwarded-For is set to $remote_addr, the address nginx itself saw.
# Any X-Forwarded-For sent by the client is discarded, so it cannot be
# spoofed. Concord trusts the last entry, which is the one nginx wrote.
# Host is passed through with its port, and Origin is passed through
# unchanged by default.
# If another proxy or CDN sits in front of nginx, the hop count changes.
#
# Replace concord.example.com and the certificate paths with your own.
# For a fuller production guide (Certbot, timeouts, upload limits), see
# docs/deploy/nginx.md.

server {
    listen 80;
    server_name concord.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name concord.example.com;

    ssl_certificate     /etc/ssl/certs/concord.crt;
    ssl_certificate_key /etc/ssl/private/concord.key;

    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}